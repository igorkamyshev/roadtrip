name: Container bench

# The bench of #25 (docs/container-bench.md): builds the graph of Europe from Geofabrik on the runner, then deploys
# a temporary Worker with the engine's Container per instance type on the owner's account, measures the cold start
# and the rings, and deletes everything it deployed. Never on an ordinary push: run it by hand (workflow_dispatch),
# or push a change to .github/container-bench.json, which also says what to run.
on:
  workflow_dispatch:
    inputs:
      graph_run_id:
        description: The run whose europe-graph artifact to use; empty builds the graph
        default: ''
      instance_types:
        description: Instance types to deploy, separated by spaces
        default: standard-1 standard-2
  push:
    branches: [claude/epic-ramanujan-4tqrk6]
    paths: [.github/container-bench.json]

concurrency:
  group: container-bench
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      graph_run_id: ${{ steps.plan.outputs.graph_run_id }}
      instance_types: ${{ steps.plan.outputs.instance_types }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        env:
          GRAPH_RUN_ID: ${{ inputs.graph_run_id }}
          INSTANCE_TYPES: ${{ inputs.instance_types }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            graph="$GRAPH_RUN_ID"
            types=$(jq -cn --arg types "$INSTANCE_TYPES" '$types | split(" ") | map(select(. != ""))')
          else
            graph=$(jq -r '.graphRunId' .github/container-bench.json)
            types=$(jq -c '.instanceTypes' .github/container-bench.json)
          fi
          echo "graph_run_id=$graph" >> "$GITHUB_OUTPUT"
          echo "instance_types=$types" >> "$GITHUB_OUTPUT"
          echo "graph from run: ${graph:-this one}; instance types: $types"

  graph:
    needs: plan
    if: needs.plan.outputs.graph_run_id == ''
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      # Outside the checkout, on the runner's large disk; upload-artifact takes no '..' in a path.
      WORK: /home/runner/bench-work
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The runner
        run: |
          lscpu | grep -E '^(Model name|CPU\(s\))'
          free -h
          df -h /
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force > /dev/null
          df -h /
      - name: Install osmium-tool
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq osmium-tool time > /dev/null
          osmium --version | head -1
      - name: Download Europe from Geofabrik
        run: |
          mkdir -p "$WORK"
          started=$(date +%s)
          curl -fsSL --retry 5 --retry-delay 30 -o "$WORK/europe.osm.pbf" https://download.geofabrik.de/europe-latest.osm.pbf
          seconds=$(( $(date +%s) - started ))
          bytes=$(stat -c %s "$WORK/europe.osm.pbf")
          echo "downloaded $bytes bytes in $seconds s: $(( bytes / seconds / 1000000 )) MB/s"
          osmium fileinfo -g header.option.osmosis_replication_timestamp "$WORK/europe.osm.pbf" || true
          df -h /
      # The filter of spec «Набор данных»: the roads, the border checkpoints, the countries and the zones of #13.
      - name: Filter with osmium
        working-directory: ${{ env.WORK }}
        run: |
          measure() { /usr/bin/time -f "$1: %e s, max RSS %M KB" "${@:2}"; }
          measure tags-filter osmium tags-filter europe.osm.pbf \
            w/highway=motorway,motorway_link,trunk,trunk_link,primary,primary_link,secondary,secondary_link,tertiary,tertiary_link \
            n/barrier=border_control r/admin_level=2 -o roads.pbf
          # Exits 1 for the relations Europe does not hold (Gaza, Western Sahara).
          measure getid osmium getid -r europe.osm.pbf \
            r2088990 r2514541 r3263728 r72639 r1574364 r1152720 r1152717 r1473938 r2559126 -o zones.pbf || true
          rm europe.osm.pbf
          measure merge osmium merge roads.pbf zones.pbf -o merged.pbf
          measure add-locations-to-ways osmium add-locations-to-ways --ignore-missing-nodes merged.pbf -o europe-roads.pbf
          rm roads.pbf zones.pbf merged.pbf
          ls -l europe-roads.pbf
          osmium fileinfo -e europe-roads.pbf | grep -E 'Number of (nodes|ways|relations)'
          df -h /
      # The step #25 measures: the JS builder reads the PBF and writes the graph.
      - name: Build the graph
        run: |
          df -h /
          /usr/bin/time -v node --max-old-space-size=8192 data/src/cli/build-graph.ts "$WORK/europe-roads.pbf" engine/dataset/graph.graph 2>&1 | tee "$WORK/build-graph.log"
          ls -l engine/dataset/graph.graph
          df -h /
      - name: Rings on the runner's CPU, for reference
        run: |
          for origin in "50.1109 8.6821" "48.1372 11.5756" "50.0755 14.4378"; do
            set -- $origin
            for hours in 1 12; do
              node data/src/cli/ring.ts engine/dataset/graph.graph --lat "$1" --lon "$2" --hours "$hours" --out /dev/null
            done
          done
      - uses: actions/upload-artifact@v4
        with:
          name: europe-graph
          path: engine/dataset/graph.graph
          retention-days: 7
          compression-level: 1
      - uses: actions/upload-artifact@v4
        with:
          name: build-graph-log
          path: ${{ env.WORK }}/build-graph.log
          retention-days: 7

  bench:
    needs: [plan, graph]
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.graph.result == 'success' || needs.graph.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        instance_type: ${{ fromJSON(needs.plan.outputs.instance_types) }}
    env:
      WORKER: roadtrip-bench-${{ matrix.instance_type }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: europe-graph
          path: engine/dataset
          run-id: ${{ needs.plan.outputs.graph_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: The dataset
        run: |
          echo '{ "version": "bench-europe" }' > engine/dataset/dataset.json
          ls -l engine/dataset
      - name: The image
        run: |
          docker build -q -f engine/Dockerfile -t roadtrip-bench-engine .
          docker image ls roadtrip-bench-engine
      # The instance's vCPU and memory on the runner, without Cloudflare: the engine server's own start and rings.
      - name: The engine server in Docker with the instance's limits
        run: |
          case "${{ matrix.instance_type }}" in
            standard-1) limits="--cpus 0.5 --memory 4g" ;;
            standard-2) limits="--cpus 1 --memory 6g" ;;
            standard-3) limits="--cpus 2 --memory 8g" ;;
            *) limits="--cpus 4 --memory 12g" ;;
          esac
          started=$(date +%s%N)
          docker run -d --name engine $limits -p 8080:8080 roadtrip-bench-engine > /dev/null
          # The engine server opens its port once the graph is loaded, and answers 404 off its path.
          until [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/)" = 404 ]; do
            if [ $(( $(date +%s%N) - started )) -gt 300000000000 ]; then docker logs engine; exit 1; fi
            sleep 0.1
          done
          echo "port ready $(( ($(date +%s%N) - started) / 1000000 )) ms after docker run ($limits)"
          docker logs engine
          node worker/bench/measure.ts server http://localhost:8080
          docker stats --no-stream engine
          docker rm -f engine > /dev/null
      - name: Deploy the bench Worker with its Container
        working-directory: worker
        run: |
          # The Container application and its image are named after the config's name, not --name.
          sed -e "s/\"name\": \"roadtrip-bench\"/\"name\": \"$WORKER\"/" \
            -e 's/"instance_type": "standard-1"/"instance_type": "${{ matrix.instance_type }}"/' bench/wrangler.jsonc > bench/wrangler.bench.jsonc
          grep -E '"(name|instance_type)"' bench/wrangler.bench.jsonc
          token=$(openssl rand -hex 24)
          echo "::add-mask::$token"
          echo "BENCH_TOKEN=$token" >> "$GITHUB_ENV"
          started=$(date +%s)
          pnpm exec wrangler deploy --config bench/wrangler.bench.jsonc --var "BENCH_TOKEN:$token"
          echo "deployed in $(( $(date +%s) - started )) s"
      - name: Measure through the bench Worker
        run: node worker/bench/measure.ts worker "https://$WORKER.kamyshev.workers.dev" "$BENCH_TOKEN"
      # Whatever happened above: the Container application, the Worker with its Durable Object namespace, the
      # image. Then the listings, to see that nothing of the bench is left.
      - name: Delete everything the bench deployed
        if: always()
        working-directory: worker
        run: |
          api() { curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/$1"; }
          for id in $(pnpm exec wrangler containers list --json | jq -r --arg name "$WORKER-enginecontainer" '.[] | select(.name == $name) | .id'); do
            pnpm exec wrangler containers delete "$id" || echo "::warning::could not delete the Container application $id"
          done
          pnpm exec wrangler delete --name "$WORKER" --force || echo "::warning::could not delete the Worker $WORKER"
          for image in $(pnpm exec wrangler containers images list --json | jq -r --arg name "$WORKER" '.[] | select(.name | startswith($name)) | .name as $repo | .tags[] | "\($repo):\(.)"'); do
            pnpm exec wrangler containers images delete "$image" --skip-confirmation || echo "::warning::could not delete the image $image"
          done
          echo "--- left on the account, of the bench:"
          echo "Container applications:"; pnpm exec wrangler containers list --json | jq -c '.[] | select(.name | startswith("roadtrip-bench")) | { id, name }'
          echo "images:"; pnpm exec wrangler containers images list --json | jq -c '.[] | select(.name | startswith("roadtrip-bench"))'
          echo "Workers:"; api workers/scripts | jq -c '[.result[].id | select(startswith("roadtrip-bench"))]'
          echo "Durable Object namespaces:"; api workers/durable_objects/namespaces | jq -c '[.result[] | select(.script // "" | startswith("roadtrip-bench")) | { id, name, script }]'
