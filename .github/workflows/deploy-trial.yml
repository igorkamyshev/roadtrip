name: Deploy trial

# Temporary (#36): runs the world build's last step, .github/dataset/deploy.sh, with the repository's secrets on the
# integration branch, to check that their token starts and reads a build of the Worker roadtrip. Deleted once it ran.
# The first run's token answered «Invalid token»: this one also says which kind of token it is (names only).
on:
  push:
    branches: [claude/epic-ramanujan-4tqrk6]
    paths: [.github/workflows/deploy-trial.yml]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: The token's kind
        run: |
          verify() { curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/$1/tokens/verify" | jq -c '{ success, status: .result.status, errors: [.errors[]?.code] }'; }
          echo "as a user token: $(verify user)"
          echo "as an account token: $(verify "accounts/$CLOUDFLARE_ACCOUNT_ID")"
          echo "Workers Builds, list build tokens: $(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/builds/tokens" | jq -c '{ success, errors }')"
      - name: Deploy the dataset
        env:
          TRIGGER: 5d0acd69-e1e3-4ad2-ac21-47399686d952
        run: .github/dataset/deploy.sh "$TRIGGER" "$GITHUB_REF_NAME"
