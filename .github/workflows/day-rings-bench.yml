name: Day rings bench

# The bench of #82 (docs/container-bench.md, «Кольца дней»): the Container's image with the current world dataset from
# R2, in Docker under standard-2's limits (1 vCPU, 6 GiB), asked the rings of days D = 1…5 from four origins. It
# deploys nothing. Never on an ordinary push: run it by hand (workflow_dispatch), or push a change to
# .github/day-rings-bench.json.
on:
  workflow_dispatch:
  push:
    branches: [claude/vibrant-mendel-47wxtt]
    paths: [.github/day-rings-bench.json]

concurrency:
  group: day-rings-bench
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The runner
        run: |
          lscpu | grep -E '^(Model name|CPU\(s\))'
          free -h
          stat -fc %T /sys/fs/cgroup
      - name: The current dataset from R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm --filter data fetch-dataset
          ls -l engine/dataset
      - name: The Container's image under standard-2's limits
        run: |
          docker build -f engine/Dockerfile -t roadtrip-engine .
          docker run -d --name engine --cpus 1 --memory 6g -p 8080:8080 roadtrip-engine
          curl -fsS --retry 60 --retry-all-errors --retry-delay 1 -o /dev/null -X POST localhost:8080/ring \
            -d '{"origin":{"lat":50.1109,"lon":8.6821},"lowerHours":0,"upperHours":1,"closedCountries":[]}'
          docker logs engine
      - name: Rings of days
        env:
          OUT: ${{ runner.temp }}/rings
        run: .github/day-rings-bench/measure.sh 8080
      - if: always()
        run: docker logs engine 2>&1 | tail -20
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: day-rings
          path: ${{ runner.temp }}/rings
          retention-days: 7
