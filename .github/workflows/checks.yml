name: Checks

# Push only, on every branch: a branch is checked before its PR is opened, and
# the PR shows the checks of its head commit.
on:
  push:

# A new push to a branch stops the run of its previous commit, which nobody
# reads any more. On the default branch every run finishes.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

jobs:
  code:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      # Every AGENTS.md has a sibling CLAUDE.md symlinked to it.
      - run: node scripts/agents-symlinks.ts --check
      # Every tracked *.sh and git hook is executable in git's index (100755): workflows and git run them by their path.
      - run: |
          if git ls-files -s -- '*.sh' '.githooks/*' | grep -v '^100755'; then
            echo '::error::Not executable in git: git update-index --chmod=+x <file> for each file above'
            exit 1
          fi
      # The workflows, by actionlint pinned to a release and its checksum; it runs shellcheck on their scripts too.
      - run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/actionlint.tar.gz" https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"
      # Every tracked *.sh and the git hooks, by the shellcheck the runner has.
      - run: |
          shellcheck --version
          git ls-files -z -- '*.sh' '.githooks/*' | xargs -0 shellcheck
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      # Oxlint, Stylelint on the CSS, then fallow (dead code, architecture, duplication, cognitive complexity) and our own checks: the
      # overrides' files, the root AGENTS.md naming every nested AGENTS.md (ADR 0002).
      - run: pnpm lint
      # Each package's Worker types (`cf-typegen`) match its wrangler config: a config changed without them fails.
      - run: |
          pnpm --recursive --if-present run cf-typegen
          git diff --exit-code -- '*worker-configuration.d.ts'
      # Every workspace package's typecheck script.
      - run: pnpm typecheck
      # Every package's tests, in one vitest run from the root: the engine's seam and the ring API's.
      - run: pnpm test
      # The Container's image as the deploy builds it (engine/Dockerfile), on a fixture's graph instead of the world's:
      # it builds, starts and answers a ring. A file the server needs outside the image's COPYs fails here, not in
      # Workers Builds after a merge. Until the server listens, Docker's port proxy takes a connection and resets it:
      # every error is retried.
      - run: |
          node data/src/cli/build-graph.ts data/test/fixtures/straight-road.osm engine/dataset/graph.graph
          docker build -f engine/Dockerfile -t roadtrip-engine .
          docker run -d --name engine -p 8080:8080 roadtrip-engine
          if ! curl -fsS --retry 30 --retry-all-errors --retry-delay 1 -X POST localhost:8080/ring \
            -d '{"origin":{"lat":0,"lon":0.5},"lowerHours":0,"upperHours":1,"closedCountries":[]}' | grep -q '"outcome":"ring"'; then
            docker logs engine
            exit 1
          fi
      # The screen's seam: the built client in Playwright's Chromium. Its build fails when the first paint's JavaScript
      # is over its budget (web/vite.config.ts). Locally the environment has the browser; CI
      # installs the one @playwright/test asks for.
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm e2e
