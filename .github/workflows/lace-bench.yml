name: Lace bench

# The bench of the lace of #77 (docs/container-bench.md, «Кружево колец дней»): the rings of days of the current world
# dataset from R2 with each growth of the small plot, as GeoJSON in the artifact `lace-rings`. It deploys nothing.
# Never on an ordinary push: run it by hand (workflow_dispatch), or push a change to .github/lace-bench.json, which
# says the variants.
on:
  workflow_dispatch:
  push:
    branches: [claude/vibrant-mendel-47wxtt]
    paths: [.github/lace-bench.json]

concurrency:
  group: lace-bench
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  rings:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The current dataset from R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter data fetch-dataset
      - name: Rings of days
        env:
          OUT: ${{ runner.temp }}/rings
        run: |
          read -ra variants <<< "$(jq -r '.variants' .github/lace-bench.json)"
          .github/lace-bench/rings.sh "${variants[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lace-rings
          path: ${{ runner.temp }}/rings
          retention-days: 7
