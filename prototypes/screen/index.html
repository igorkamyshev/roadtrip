<title>Прототип экрана Roadtrip</title>
<!--
  ПРОТОТИП, выбросить после решения. Тикет «Экран на телефоне: карта, кольцо, ползунок, города и настройки».
  Три разных варианта единственного экрана, переключаются стрелками в чёрной панели снизу (или #a, #b, #c в адресе).
  Там же переключатель состояний: нет геолокации, расчёт идёт, ошибка, лимит исчерпан, нет городов.
  Данные ненастоящие: кольца считает игрушечный обход сетки 0,2° (скорость по прямой со случайным шумом,
  ×1,2, +1,5 ч на границе вне Шенгена), визовые правила примерные. Города настоящие: GeoNames от 15 000 жителей.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: one phone screen, map fills it; each variant owns its layout. The black dev bar is prototype chrome, not design. */
:root {
  --bg: #eef1ef; --surface: #ffffff; --surface-2: #f3f6f4; --fg: #16201d; --muted: #5d6a66; --line: #dbe2df;
  --land: #e8ebe5; --land-closed: #dcdfd8; --hatch: #b9c0bb; --sea: #c3d7de; --borderline: #9fa9a4; --label: #75817c;
  --ring: #1b5fd6; --ring-fill: rgba(27, 95, 214, .24); --start: #e2412c; --city: #0e2a5a; --halo: #f4f6f2;
  --evisa: #7f4b00; --evisa-bg: #ffecc7; --held: #54309e; --held-bg: #ebe3fb; --warn: #6e4a00; --warn-bg: #fff4dc;
  --err: #b42d25; --err-bg: #fde7e4; --ok: #1d6f47;
  --shadow: 0 2px 10px rgba(16, 30, 26, .14), 0 1px 2px rgba(16, 30, 26, .10);
  --font: "Golos Text", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --display: "Unbounded", "Golos Text", system-ui, sans-serif;
  --dev: #0b0b0c; --dev-fg: #f2f2f2; --dev-dim: #9a9a9a; --dev-accent: #ffd400;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1413; --surface: #19201f; --surface-2: #212a28; --fg: #e6edea; --muted: #98a6a1; --line: #2c3634;
  --land: #222a28; --land-closed: #1b2120; --hatch: #36403d; --sea: #0e1a1f; --borderline: #4b5853; --label: #7f8d88;
  --ring: #6aa3ff; --ring-fill: rgba(106, 163, 255, .24); --start: #ff6a52; --city: #d6e4ff; --halo: #1c2321;
  --evisa: #ffcf7d; --evisa-bg: #3a2b0e; --held: #cbb3ff; --held-bg: #2c2444; --warn: #ffcf7d; --warn-bg: #2c2410;
  --err: #ff8f85; --err-bg: #3b1915; --ok: #6fd3a0; --shadow: 0 2px 14px rgba(0, 0, 0, .55); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0f1413; --surface: #19201f; --surface-2: #212a28; --fg: #e6edea; --muted: #98a6a1; --line: #2c3634;
  --land: #222a28; --land-closed: #1b2120; --hatch: #36403d; --sea: #0e1a1f; --borderline: #4b5853; --label: #7f8d88;
  --ring: #6aa3ff; --ring-fill: rgba(106, 163, 255, .24); --start: #ff6a52; --city: #d6e4ff; --halo: #1c2321;
  --evisa: #ffcf7d; --evisa-bg: #3a2b0e; --held: #cbb3ff; --held-bg: #2c2444; --warn: #ffcf7d; --warn-bg: #2c2410;
  --err: #ff8f85; --err-bg: #3b1915; --ok: #6fd3a0; --shadow: 0 2px 14px rgba(0, 0, 0, .55); color-scheme: dark; }

html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.4 var(--font); overflow: hidden; -webkit-tap-highlight-color: transparent; }
#root { height: 100%; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
.stage { height: 100%; display: flex; flex-direction: column; }
.phone { position: relative; flex: 1; min-height: 0; overflow: hidden; background: var(--bg); }
@media (min-width: 720px) {
  .stage { align-items: center; justify-content: center; gap: 12px; padding-block: 16px; box-sizing: border-box; }
  .phone { flex: none; width: 390px; height: min(844px, calc(100% - 96px)); border-radius: 30px; border: 1px solid var(--line); box-shadow: 0 20px 60px rgba(0, 0, 0, .18); }
  .dev { width: 390px; border-radius: 16px; }
}

/* ---------- dev bar (prototype chrome) ---------- */
.dev { flex: none; background: var(--dev); color: var(--dev-fg); padding: 6px 10px; font-size: 13px; box-sizing: border-box; }
.dev-row { display: flex; align-items: center; gap: 6px; }
.dev-arrow { width: 34px; height: 34px; border-radius: 10px; background: #222; font-size: 18px; flex: none; }
.dev-label { flex: 1; min-width: 0; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dev-label b { color: var(--dev-accent); text-transform: uppercase; margin-right: 4px; }
.dev select { background: #222; border: 0; border-radius: 10px; color: var(--dev-fg); height: 34px; padding: 0 6px; max-width: 46%; }
.dev-state { color: var(--dev-dim); font-size: 11px; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; }

/* ---------- map ---------- */
.map { position: absolute; inset: 0; touch-action: none; user-select: none; -webkit-user-select: none; overflow: hidden; background: var(--sea); }
.map svg { display: block; width: 100%; height: 100%; }
.m-land { fill: var(--land); stroke: var(--borderline); }
.m-closed { fill: url(#hatch); }
.m-hatch-bg { fill: var(--land-closed); }
.m-hatch-line { stroke: var(--hatch); }
.m-clabel { fill: var(--label); font-family: var(--font); font-weight: 600; letter-spacing: .08em; pointer-events: none; }
.ring { fill: var(--ring-fill); stroke: var(--ring); fill-rule: evenodd; }
.ring-dim { opacity: .45; stroke-dasharray: 4 4; animation: dash 1s linear infinite; }
.ring-stripes { fill: url(#stripes); stroke-dasharray: 3 5; }
@keyframes dash { to { stroke-dashoffset: -16; } }
.m-stripe { fill: var(--ring); opacity: .35; }
.m-city { fill: var(--city); stroke: var(--halo); }
.m-city-hl { fill: var(--start); stroke: var(--halo); }
.m-clab { fill: var(--city); stroke: var(--halo); paint-order: stroke; stroke-linejoin: round; font-family: var(--font); font-weight: 600; pointer-events: none; }
.m-start { fill: var(--start); stroke: #fff; }
.m-pulse { fill: none; stroke: var(--ring); }
.crosshair { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -100%); color: var(--start); pointer-events: none; filter: drop-shadow(0 2px 2px rgba(0,0,0,.3)); }
.crosshair svg { width: 40px; height: 40px; fill: var(--start); stroke: #fff; }
.ripple { position: absolute; width: 60px; height: 60px; margin: -30px 0 0 -30px; border-radius: 50%; border: 2px solid var(--start); pointer-events: none; animation: ripple .5s ease-out forwards; }
@keyframes ripple { from { transform: scale(.2); opacity: 1; } to { transform: scale(1); opacity: 0; } }

/* ---------- shared bits ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 40px; padding: 0 14px; border-radius: 12px; background: var(--surface-2); font-weight: 500; text-decoration: none; color: var(--fg); white-space: nowrap; }
.btn.primary { background: var(--ring); color: #fff; }
:root[data-theme="dark"] .btn.primary { color: #0b1630; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.primary { color: #0b1630; } }
.btn svg { width: 18px; height: 18px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.badge { display: inline-block; font-size: 12px; font-weight: 500; line-height: 1; padding: 4px 7px; border-radius: 6px; white-space: nowrap; }
.b-evisa { background: var(--evisa-bg); color: var(--evisa); }
.b-held { background: var(--held-bg); color: var(--held); }
.b-plain { background: var(--surface-2); color: var(--muted); }
.note { display: flex; gap: 8px; align-items: flex-start; padding: 10px 12px; border-radius: 12px; background: var(--warn-bg); color: var(--warn); font-size: 13px; }
.note svg { flex: none; width: 18px; height: 18px; margin-top: 1px; }
.card-msg { padding: 14px; border-radius: 14px; background: var(--surface-2); display: grid; gap: 10px; }
.card-msg.err { background: var(--err-bg); color: var(--err); }
.card-msg h4 { margin: 0; font-size: 15px; }
.card-msg p { margin: 0; font-size: 14px; color: var(--muted); }
.card-msg.err p { color: inherit; opacity: .85; }
.bar { height: 3px; background: var(--line); overflow: hidden; border-radius: 2px; }
.bar i { display: block; height: 100%; width: 35%; background: var(--ring); animation: bar 1.1s ease-in-out infinite; }
@keyframes bar { from { transform: translateX(-100%); } to { transform: translateX(300%); } }
.skel { height: 44px; border-radius: 10px; background: linear-gradient(90deg, var(--surface-2), var(--line), var(--surface-2)); background-size: 200% 100%; animation: skel 1.2s linear infinite; }
@keyframes skel { to { background-position: -200% 0; } }
.toast { position: absolute; left: 50%; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 9px 14px; border-radius: 12px; font-size: 14px; white-space: nowrap; z-index: 40; box-shadow: var(--shadow); display: flex; gap: 12px; align-items: center; }
.toast button { color: var(--ring); font-weight: 600; filter: brightness(1.4); }
.spin { display: inline-block; width: 12px; height: 12px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; vertical-align: -1px; }
@keyframes spin { to { transform: rotate(360deg); } }
.row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); text-align: left; width: 100%; }
.row-main { flex: 1; min-width: 0; }
.row-name { font-weight: 600; }
.row-alt { font-weight: 400; color: var(--muted); font-size: 13px; margin-left: 6px; }
.row-sub { font-size: 13px; color: var(--muted); }
.search-in { display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 12px; border-radius: 12px; background: var(--surface-2); }
.search-in input { flex: 1; min-width: 0; border: 0; background: none; outline: none; font-size: 16px; }
.pick { display: grid; }
.pick-item { display: flex; align-items: center; gap: 10px; padding: 11px 2px; border-bottom: 1px solid var(--line); text-align: left; }
.pick-box { width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--borderline); display: grid; place-items: center; flex: none; }
.pick-item.on .pick-box { background: var(--ring); border-color: var(--ring); color: #fff; }
.pick-box svg { width: 14px; height: 14px; }
.pick-sub { font-size: 12px; color: var(--muted); }
.pick-sep { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; padding: 14px 2px 4px; }
.scrim { position: absolute; inset: 0; background: rgba(0, 0, 0, .35); z-index: 50; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; max-height: 86%; background: var(--surface); border-radius: 20px 20px 0 0; z-index: 51; display: flex; flex-direction: column; box-shadow: var(--shadow); }
.sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 8px; }
.sheet-head h3 { margin: 0; font-size: 17px; }
.sheet-body { overflow: auto; padding: 4px 16px 18px; }

/* ---------- slider ---------- */
.sl { touch-action: none; user-select: none; -webkit-user-select: none; cursor: pointer; }
.sl-off { opacity: .4; pointer-events: none; }
.sl-h { padding: 12px 10px 18px; }
.sl-h .sl-track { position: relative; height: 6px; border-radius: 3px; background: var(--line); }
.sl-h .sl-fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--ring); border-radius: 3px; }
.sl-tick { position: absolute; }
.sl-h .sl-tick { top: 50%; transform: translate(-50%, -50%); }
.sl-tick i { display: block; width: 4px; height: 4px; border-radius: 50%; background: var(--borderline); }
.sl-tick.on i { background: #fff; }
.sl-tick.sl-cached i { width: 6px; height: 6px; background: var(--ok); box-shadow: 0 0 0 2px var(--surface); }
.sl-tick em { position: absolute; font-style: normal; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.sl-h .sl-tick em { top: 12px; left: 50%; transform: translateX(-50%); }
.sl-thumb { position: absolute; width: 26px; height: 26px; border-radius: 50%; background: var(--surface); border: 3px solid var(--ring); box-sizing: border-box; box-shadow: var(--shadow); }
.sl-h .sl-thumb { top: 50%; transform: translate(-50%, -50%); }
.sl-thumb b { position: absolute; bottom: 34px; left: 50%; transform: translateX(-50%); background: var(--fg); color: var(--bg); font-size: 13px; padding: 3px 8px; border-radius: 8px; white-space: nowrap; }
.sl-v { padding: 13px 14px; height: 100%; box-sizing: border-box; }
.sl-v .sl-track { position: relative; width: 6px; height: 100%; border-radius: 3px; background: var(--line); margin: 0 auto; }
.sl-v .sl-fill { position: absolute; left: 0; right: 0; bottom: 0; background: var(--ring); border-radius: 3px; }
.sl-v .sl-tick { left: 50%; transform: translate(-50%, 50%); }
.sl-v .sl-tick em { right: 12px; top: 50%; transform: translateY(-50%); }
.sl-v .sl-thumb { left: 50%; transform: translate(-50%, 50%); }
.sl-v .sl-thumb b { bottom: auto; left: auto; right: 34px; top: 50%; transform: translateY(-50%); }

/* ---------- variant A: sheet ---------- */
.a-top { position: absolute; top: 12px; left: 12px; right: 12px; display: flex; gap: 8px; z-index: 10; }
.a-search { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 14px; border-radius: 24px; background: var(--surface); box-shadow: var(--shadow); text-align: left; }
.a-search span { display: flex; flex-direction: column; min-width: 0; line-height: 1.15; }
.a-search b { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
.a-search small { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.a-gear { width: 48px; height: 48px; border-radius: 24px; background: var(--surface); box-shadow: var(--shadow); display: grid; place-items: center; position: relative; flex: none; }
.a-gear i { position: absolute; top: 9px; right: 9px; width: 9px; height: 9px; border-radius: 50%; background: var(--start); border: 2px solid var(--surface); }
.a-chip { position: absolute; top: 66px; left: 12px; z-index: 10; background: var(--surface); box-shadow: var(--shadow); border-radius: 14px; font-size: 12px; padding: 5px 10px; color: var(--muted); }
.a-chip b { color: var(--fg); font-weight: 600; }
.a-fab { position: absolute; right: 12px; width: 44px; height: 44px; border-radius: 22px; background: var(--surface); box-shadow: var(--shadow); display: grid; place-items: center; z-index: 9; transition: bottom .2s; }
.a-sheet { position: absolute; left: 0; right: 0; bottom: 0; background: var(--surface); border-radius: 20px 20px 0 0; box-shadow: 0 -4px 20px rgba(0, 0, 0, .12); z-index: 20; display: flex; flex-direction: column; transition: height .22s ease; }
.a-sheet.dragging { transition: none; }
.a-grab { padding: 8px 0 2px; display: grid; place-items: center; touch-action: none; cursor: grab; }
.a-grab span { width: 40px; height: 5px; border-radius: 3px; background: var(--line); }
.a-head { padding: 0 16px; touch-action: none; }
.a-hrow { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.a-big { font-family: var(--display); font-weight: 700; font-size: 26px; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
.a-status { font-size: 14px; color: var(--muted); text-align: right; }
.a-status.s-err { color: var(--err); }
.a-status.s-ok { color: var(--fg); font-weight: 600; }
.a-body { flex: 1; min-height: 0; overflow: auto; padding: 0 16px 16px; display: grid; align-content: start; gap: 10px; }
.a-body.dim .row { opacity: .4; }
.a-body > *, .b-list > *, .sheet-body > *, .page-body > * { min-width: 0; }
.a-more { height: 44px; color: var(--ring); font-weight: 600; }
.a-foot { font-size: 12px; color: var(--muted); padding-top: 4px; }
.a-idle { padding: 4px 16px 16px; display: grid; gap: 12px; }
.a-idle h2 { margin: 0; font-family: var(--display); font-size: 22px; font-weight: 700; }
.a-fake { display: flex; align-items: center; gap: 8px; height: 46px; padding: 0 14px; border-radius: 12px; background: var(--surface-2); color: var(--muted); text-align: left; }
.a-idle-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.a-card { padding: 4px 16px 16px; display: grid; gap: 8px; align-content: start; overflow: auto; }
.a-card h3 { margin: 0; font-family: var(--display); font-size: 22px; font-weight: 700; }
.a-back { justify-self: start; display: flex; align-items: center; gap: 2px; color: var(--ring); font-weight: 600; margin-left: -6px; }
.a-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
.page { position: absolute; inset: 0; background: var(--surface); z-index: 60; display: flex; flex-direction: column; }
.page-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.page-head h2 { flex: 1; margin: 0; font-size: 18px; }
.page-body { flex: 1; min-height: 0; overflow: auto; padding: 8px 16px 24px; }
.page-body h3 { font-size: 16px; margin: 18px 0 2px; }
.page-body > p { margin: 0 0 6px; }
.ico-btn { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; flex: none; }

/* ---------- variant B: list first ---------- */
.b { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--surface); }
.b-head { flex: none; padding: 10px 16px 8px; display: grid; gap: 8px; border-bottom: 1px solid var(--line); position: relative; z-index: 12; background: var(--surface); }
.b-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.b-logo { font-family: var(--display); font-weight: 700; font-size: 17px; letter-spacing: -.01em; }
.b-set { display: flex; align-items: center; gap: 4px; font-size: 13px; padding: 6px 8px 6px 10px; border-radius: 10px; background: var(--surface-2); max-width: 62%; }
.b-set span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.b-set svg { width: 16px; height: 16px; flex: none; transition: transform .2s; }
.b-set.open svg { transform: rotate(180deg); }
.b-panel { display: grid; gap: 6px; padding: 4px 0 6px; }
.b-panel h4 { margin: 6px 0 0; font-size: 13px; color: var(--muted); font-weight: 500; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { height: 32px; padding: 0 12px; border-radius: 16px; border: 1px solid var(--line); font-size: 14px; display: inline-flex; align-items: center; gap: 6px; }
.chip.on { background: var(--ring); border-color: var(--ring); color: #fff; }
.chip select { border: 0; background: none; height: 100%; }
.b-start { display: flex; gap: 8px; align-items: center; position: relative; }
.b-startbtn { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; height: 42px; padding: 0 12px; border-radius: 12px; background: var(--surface-2); text-align: left; }
.b-startbtn span { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.b-startbtn svg { color: var(--start); flex: none; }
.b-res { position: absolute; top: 48px; left: 0; right: 0; background: var(--surface); box-shadow: var(--shadow); border-radius: 12px; padding: 0 12px; z-index: 30; max-height: 320px; overflow: auto; }
.b-map { flex: none; height: 40%; position: relative; }
.b-slider { position: absolute; left: 10px; right: 10px; bottom: 10px; z-index: 5; background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); display: flex; align-items: center; gap: 4px; padding-left: 12px; }
.b-slider .sl { flex: 1; }
.b-slval { font-family: var(--display); font-weight: 700; font-size: 15px; min-width: 64px; font-variant-numeric: tabular-nums; }
.b-list { flex: 1; min-height: 0; overflow: auto; padding: 10px 16px 20px; display: grid; gap: 10px; align-content: start; }
.b-sum { font-size: 14px; color: var(--muted); }
.b-sum b { color: var(--fg); }
.b-banner { display: flex; gap: 8px; align-items: flex-start; padding: 10px 10px 10px 12px; border-radius: 12px; background: var(--warn-bg); color: var(--warn); font-size: 13px; }
.b-banner span { flex: 1; }
.b-banner button { flex: none; width: 24px; height: 24px; display: grid; place-items: center; }
.b-banner svg { width: 16px; height: 16px; }
.b-group { border: 1px solid var(--line); border-radius: 14px; padding: 4px 12px; }
.b-ghead { display: flex; align-items: center; gap: 8px; padding: 8px 0 6px; }
.b-ghead h4 { margin: 0; font-size: 16px; flex: 1; }
.b-gcount { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.b-gnote { font-size: 12px; color: var(--warn); margin: -2px 0 4px; }
.b-group .row:last-child { border-bottom: 0; }
.b-more { height: 40px; color: var(--ring); font-weight: 600; font-size: 14px; }
.b-detail { padding: 2px 0 12px; display: grid; gap: 8px; }

/* ---------- variant C: phrase + carousel ---------- */
.c-phrase { position: absolute; top: 12px; left: 12px; right: 12px; z-index: 10; background: var(--surface); border-radius: 18px; box-shadow: var(--shadow); padding: 12px 14px; font-size: 17px; line-height: 1.6; }

  </div>`;
}

/* ============ prototype shell: variant switcher + state switcher ============ */
const VARIANTS = [{ key: 'a', name: 'Шторка', C: VariantA }, { key: 'b', name: 'Список под картой', C: VariantB }, { key: 'c', name: 'Фраза и карусель', C: VariantC }];
const STATES = [['normal', 'Обычное'], ['nogeo', 'Нет геолокации'], ['loading', 'Расчёт идёт'], ['error', 'Ошибка расчёта'], ['limit', 'Лимит исчерпан'], ['empty', 'Нет городов']];
const STATUS_RU = { idle: 'нет старта', loading: 'считаем', ready: 'готово', error: 'ошибка', limit: 'лимит' };
const fromHash = () => { const k = (location.hash || '').slice(1); return VARIANTS.some(v => v.key === k) ? k : 'a'; };
function App() {
  const app = useRoadtrip();
  const [vk, setVk] = useState(fromHash);
  const vi = VARIANTS.findIndex(v => v.key === vk), V = VARIANTS[vi];
  const go = d => { const n = VARIANTS[(vi + d + VARIANTS.length) % VARIANTS.length].key; setVk(n); try { location.hash = n; } catch (e) {} };
  useEffect(() => {
    const h = () => setVk(fromHash());
    const k = e => { if (e.target.closest && e.target.closest('input,textarea,select,[contenteditable],[role=slider]')) return; if (e.key === 'ArrowLeft') go(-1); if (e.key === 'ArrowRight') go(1); };
    addEventListener('hashchange', h); addEventListener('keydown', k); return () => { removeEventListener('hashchange', h); removeEventListener('keydown', k); };
  });
  const stateVal = app.forced || (app.geoDenied && !app.start ? 'nogeo' : 'normal');
  const n = app.cities ? app.cities.length : null;
  return html`<div className="stage">
    <main className="phone"><${V.C} key=${vk} app=${app}/></main>
    <div className="dev" aria-label="Панель прототипа">
      <div className="dev-row">
        <button className="dev-arrow" onClick=${() => go(-1)} aria-label="Предыдущий вариант">‹</button>
        <div className="dev-label"><b>${V.key}</b>${V.name}</div>
        <button className="dev-arrow" onClick=${() => go(1)} aria-label="Следующий вариант">›</button>
        <select id="dev-state" value=${stateVal} onChange=${e => app.setForced(e.target.value)} aria-label="Состояние">${STATES.map(([k, t]) => html`<option key=${k} value=${k}>${t}</option>`)}</select>
      </div>
      <div className="dev-state">Прототип, данные ненастоящие · ${app.start ? app.start.short : 'нет старта'} · ${hoursText(app.hours)} · ${citsShort(app.cits)} · визы: ${visasShort(app.visas)} · ${STATUS_RU[app.ring.status]}${n != null ? ' · ' + citiesWord(n) : ''}</div>
    </div>
  </div>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>
